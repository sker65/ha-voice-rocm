# Qwen3-TTS VoiceDesign (1.7B) als Wyoming-TTS für Home Assistant
# Minisforum mit Ryzen AI 9 HX 370 / Radeon 890M (gfx1150)
#
# Ablage: im Wurzelverzeichnis des geklonten Repos ndom91/ha-voice-rocm
# Start:  docker compose -f docker-compose.jarvis.yml up -d --build
# Log:    docker compose -f docker-compose.jarvis.yml logs -f
# HA:     Wyoming Protocol, IP des Minisforum, Port 10204

services:
  qwen-tts:
    build:
      context: .
      dockerfile: qwen3-tts-voicedesign/Dockerfile
      args:
        HSA_OVERRIDE_GFX_VERSION: "11.5.0"
    container_name: qwen-tts-voicedesign
    restart: unless-stopped

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined
    group_add:
      - video
      - render

    environment:
      # GPU: 890M = gfx1150. Falls der Container beim ersten Sprechen
      # abstürzt oder keine GPU-Kernel findet, auf "11.0.0" stellen.
      HSA_OVERRIDE_GFX_VERSION: "11.5.0"
      HIP_VISIBLE_DEVICES: "0"
      ROCM_PATH: /opt/rocm
      LD_LIBRARY_PATH: /usr/local/lib:/opt/rocm/lib:/opt/rocm/lib/llvm/lib
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"

      # Caches im Volume, damit Modell und Kernel-Tuning Neustarts überleben
      MIOPEN_USER_DB_PATH: /data/miopen/user-db
      MIOPEN_CUSTOM_CACHE_DIR: /data/miopen/cache
      MIOPEN_FIND_MODE: "2"
      # Alle HF-Caches auf denselben Ordner, sonst greift der
      # Tokenizer-Fix des Containers nicht (Download und Laden müssen
      # dieselbe Modellkopie verwenden)
      HF_HOME: /data/hf_cache
      HF_HUB_CACHE: /data/hf_cache
      HUGGINGFACE_HUB_CACHE: /data/hf_cache
      TRANSFORMERS_CACHE: /data/hf_cache
      QWEN_VOICEDESIGN_CACHE_DIR: /data/models

      # Stimme: Beschreibung auf Englisch funktioniert am zuverlässigsten
      QWEN_VOICEDESIGN_INSTRUCT: "Deep, calm female voice in her mid-thirties, slightly husky, composed and matter-of-fact with a hint of dry irony"
      # Fest auf Deutsch, "Auto" rät bei kurzen Sätzen manchmal falsch
      QWEN_VOICEDESIGN_LANGUAGE: German
      QWEN_VOICEDESIGN_DEVICE: "cuda:0"
      QWEN_VOICEDESIGN_DTYPE: bfloat16
      QWEN_VOICEDESIGN_SAMPLES_PER_CHUNK: "1024"
      QWEN_VOICEDESIGN_DEBUG: "false"

    ports:
      - "10204:10200"   # Wyoming (Home Assistant)
      - "10214:10201"   # OpenAI-kompatibel: POST /v1/audio/speech (zum Testen)

    volumes:
      - ./qwen-tts-data:/data

    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',10200)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

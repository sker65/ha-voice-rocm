# Qwen3-TTS CustomVoice (0.6B), Sprecherin Sohee, als Wyoming-TTS für Home Assistant
# Minisforum mit Ryzen AI 9 HX 370 / Radeon 890M (gfx1150)
#
# Ablage: im Wurzelverzeichnis des geklonten Repos ndom91/ha-voice-rocm
# Start:  docker compose -f docker-compose.sohee.yml up -d --build
# Log:    docker compose -f docker-compose.sohee.yml logs -f
# HA:     Wyoming Protocol, IP des Minisforum, Port 10205
# Test:   POST http://<IP>:10215/v1/audio/speech

services:
  qwen-tts-sohee:
    # Gleiches Dockerfile wie der VoiceDesign-Container: enthält denselben
    # Server-Code plus aiohttp für die OpenAI-Schnittstelle. Modell und
    # Sprecherin legt der entrypoint unten fest.
    build:
      context: .
      dockerfile: qwen3-tts-voicedesign/Dockerfile
      args:
        HSA_OVERRIDE_GFX_VERSION: "11.5.0"
    container_name: qwen-tts-sohee
    restart: unless-stopped

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined
    group_add:
      - video
      - render

    environment:
      # GPU: 890M = gfx1150 (funktioniert, siehe VoiceDesign-Container)
      HSA_OVERRIDE_GFX_VERSION: "11.5.0"
      HIP_VISIBLE_DEVICES: "0"
      ROCM_PATH: /opt/rocm
      LD_LIBRARY_PATH: /usr/local/lib:/opt/rocm/lib:/opt/rocm/lib/llvm/lib
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"

      # Kernel-Tuning im Volume, damit es Neustarts überlebt
      MIOPEN_USER_DB_PATH: /data/miopen/user-db
      MIOPEN_CUSTOM_CACHE_DIR: /data/miopen/cache
      MIOPEN_FIND_MODE: "2"

      # Alle HF-Caches auf denselben Ordner, sonst greift der
      # Tokenizer-Fix des Containers nicht
      HF_HOME: /data/hf_cache
      HF_HUB_CACHE: /data/hf_cache
      HUGGINGFACE_HUB_CACHE: /data/hf_cache
      # Löst eine harmlose Veraltet-Warnung aus, wird aber noch gebraucht
      TRANSFORMERS_CACHE: /data/hf_cache

    # Eigener Start statt entrypoint.sh, damit auch die OpenAI-Schnittstelle
    # zum Testen läuft (das Original-Entrypoint startet sie nicht)
    entrypoint:
      - python3
      - /app/qwen_wrapper.py
      - --uri
      - tcp://0.0.0.0:10200
      - --openai-uri
      - http://0.0.0.0:10201
      - --model
      - Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
      - --speaker
      - Sohee
      # Optional: Tonfall, z. B. "Calm and composed" oder "Slightly ironic"
      - --instruct
      - ""
      - --language
      - German
      - --device
      - cuda:0
      - --dtype
      - bfloat16
      - --samples-per-chunk
      - "1024"
      - --cache-dir
      - /data/models

    ports:
      - "10205:10200"   # Wyoming (Home Assistant)
      - "10215:10201"   # OpenAI-kompatibel: POST /v1/audio/speech (zum Testen)

    volumes:
      - ./qwen-tts-sohee-data:/data

    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',10200)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
